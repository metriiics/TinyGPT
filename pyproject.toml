[project]
name = "tinygpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "metriiics", email = "metriics@yandex.ru" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets>=4",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.1",
    "numpy>=2.1",
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
    "torch>=2.11.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
tinygpt = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
